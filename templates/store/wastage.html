<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Wastage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #ff758c, #ff7eb3);">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 500px; border-radius: 15px;">

        <!-- Heading -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Store Wastage</h2>
            <p class="text-muted">Record damaged stock in store</p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mt-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST">

            <!-- Ingredient -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Ingredient</label>
                <select name="ingredient_id"
                        id="ingredientSelect"
                        class="form-select"
                        required>
                    {% for ingredient in ingredients %}
                        <option value="{{ ingredient.id }}"
                                data-unit="{{ ingredient.base_unit }}"
                                data-stock="{{ ingredient.available_stock }}">
                            {{ ingredient.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Available stock -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Available Stock</label>
                <input type="text"
                       id="availableStock"
                       class="form-control"
                       readonly>
            </div>

            <!-- Quantity -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Wastage Quantity</label>
                <input type="number"
                       step="0.01"
                       name="quantity"
                       class="form-control"
                       placeholder="Enter wastage quantity"
                       required>
            </div>

            <!-- Unit -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Unit</label>
                <select name="unit"
                        id="unitSelect"
                        class="form-select"
                        required>
                </select>
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger">
                    Save Wastage
                </button>

                <a href="/store/receive" class="btn btn-secondary">
                    Back
                </a>
            </div>

        </form>

    </div>

</div>

<script>
const ingredientSelect = document.getElementById("ingredientSelect");
const unitSelect = document.getElementById("unitSelect");
const availableStock = document.getElementById("availableStock");

const unitMap = {
    "g": ["g", "kg"],
    "ml": ["ml", "litre"],
    "pieces": ["pieces"]
};

function updateUnits() {
    const selectedOption =
        ingredientSelect.options[ingredientSelect.selectedIndex];

    const baseUnit = selectedOption.getAttribute("data-unit");
    const stock = selectedOption.getAttribute("data-stock");

    unitSelect.innerHTML = "";

    unitMap[baseUnit].forEach(unit => {
        let option = document.createElement("option");
        option.value = unit;
        option.text = unit;
        unitSelect.appendChild(option);
    });

    availableStock.value = stock + " " + baseUnit;
}

ingredientSelect.addEventListener("change", updateUnits);

updateUnits();
</script>

</body>
</html>
