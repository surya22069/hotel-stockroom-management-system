<!DOCTYPE html>
<html>
<head>
    <title>Purchase History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h2>Purchase Order History</h2>

    <table class="table table-bordered text-center">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ingredient</th>
                <th>Vendor</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Expected Date</th>
            </tr>
        </thead>

        <tbody>
            {% for order in orders %}
            <tr>
                <td>{{ order.id }}</td>
                <td>{{ order.ingredient.name }}</td>
                <td>{{ order.vendor_name }}</td>
                <td>{{ order.ordered_qty }}</td>
                <td>{{ order.status }}</td>
                <td>{{ order.expected_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/manager/dashboard" class="btn btn-primary">Back</a>
</div>
</body>
</html>
