<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #f7971e, #ffd200);">

<div class="container mt-5">
    <div class="card shadow-lg p-4">

        <div class="text-center mb-4">
            <h2 class="fw-bold">F&B Manager Dashboard</h2>
            <p class="text-muted">Inventory control center</p>
        </div>

        <div class="d-grid gap-3">

            <a href="/manager/purchase-orders" class="btn btn-warning btn-lg">
                Approve Purchase Orders
            </a>

            <a href="/manager/variance" class="btn btn-primary btn-lg">
                Variance Report
            </a>

            <a href="/manager/wastage-report" class="btn btn-danger btn-lg">
                Wastage Report
            </a>

            <a href="/manager/consumption-report" class="btn btn-success btn-lg">
                Consumption Report
            </a>

            <a href="/manager/low-stock" class="btn btn-info btn-lg">
                Low Stock Alerts
            </a>

            <a href="/manager/purchase-history" class="btn btn-secondary btn-lg">
                Purchase History
            </a>

            <a href="/logout" class="btn btn-dark btn-lg">
                Logout
            </a>

        </div>

    </div>
</div>

</body>
</html>
