<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockRoom Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #4facfe, #00f2fe);">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        
        <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">StockRoom</h2>
                <p class="text-muted">Login to manage your inventory</p>
            </div>

            <form method="POST" action="/login">
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" 
                           name="email" 
                           class="form-control" 
                           placeholder="Enter your email" 
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Enter your password" 
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>
                </div>

            </form>

            <hr>

            <div class="text-center">
                <small class="text-muted">
                    2026 StockRoom Management System
                </small>
            </div>

        </div>

    </div>

</body>
</html>
