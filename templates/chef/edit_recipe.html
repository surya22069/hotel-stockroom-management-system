<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #ff9966, #ff5e62);">

<div class="container mt-5">

    <div class="card shadow-lg p-4" style="border-radius: 15px;">

        <!-- Title -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-success">Edit Recipe</h2>
            <p class="text-muted">
                Update recipe name
            </p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show"
                         role="alert">
                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Form -->
        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-semibold">Recipe Name</label>
                <input type="text"
                       name="recipe_name"
                       value="{{ recipe.dish_name }}"
                       class="form-control"
                       required>
            </div>

            <div class="d-grid gap-2">

                <button type="submit" class="btn btn-success">
                    Update Recipe
                </button>

                <a href="/chef/recipes"
                   class="btn btn-primary">
                    Back to Recipes
                </a>

            </div>

        </form>

        <hr>

        <div class="text-center">
            <small class="text-muted">
                StockRoom Kitchen Recipe Management
            </small>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
