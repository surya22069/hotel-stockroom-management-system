<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Stock Request</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #ff9966, #ff5e62);">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 500px; border-radius: 15px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Chef Stock Request</h2>
            <p class="text-muted">Request ingredients from store</p>
        </div>

        <form method="POST" action="/chef/request">

            <!-- Ingredient Dropdown -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Ingredient</label>
                <select name="ingredient_id" id="ingredientSelect" class="form-select" required>
                    {% for ingredient in ingredients %}
                        <option value="{{ ingredient.id }}"
                                data-unit="{{ ingredient.base_unit }}">
                            {{ ingredient.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Quantity -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Quantity</label>
                <input type="number"
                       step="0.01"
                       name="quantity"
                       class="form-control"
                       placeholder="Enter required quantity"
                       required>
            </div>

            <!-- Dynamic Unit Dropdown -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Unit</label>
                <select name="unit" id="unitSelect" class="form-select" required>
                </select>
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning">
                    Request Stock
                </button>

                <a href="/chef/dashboard" class="btn btn-primary">
                    Back to Dashboard
                </a>

                <a href="/logout" class="btn btn-danger">
                    Logout
                </a>
            </div>

        </form>

        <hr>

        <div class="text-center">
            <small class="text-muted">
                © 2026 StockRoom Kitchen Management
            </small>
        </div>

    </div>

</div>

<script>
const ingredientSelect = document.getElementById("ingredientSelect");
const unitSelect = document.getElementById("unitSelect");

const unitMap = {
    "g": ["g", "kg"],
    "ml": ["ml", "litre"],
    "pieces": ["pieces"]
};

function updateUnits() {
    const selectedOption = ingredientSelect.options[ingredientSelect.selectedIndex];
    const baseUnit = selectedOption.getAttribute("data-unit");

    unitSelect.innerHTML = "";

    unitMap[baseUnit].forEach(unit => {
        let option = document.createElement("option");
        option.value = unit;
        option.text = unit;
        unitSelect.appendChild(option);
    });
}

ingredientSelect.addEventListener("change", updateUnits);
updateUnits();
</script>

</body>
</html>
