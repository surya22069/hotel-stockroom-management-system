<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #ff9966, #ff5e62);">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 500px; border-radius: 15px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Chef Dashboard</h2>
            <p class="text-muted">Manage kitchen stock, recipes and requests</p>
        </div>

        <div class="d-grid gap-3">

            <!-- View Stock -->
            <a href="/chef/stock" class="btn btn-primary btn-lg">
                View Available Stock
            </a>

            <!-- Request Stock -->
            <a href="/chef/request" class="btn btn-warning btn-lg">
                Request Stock
            </a>

            <!-- Recipe Master -->
            <a href="/chef/recipes" class="btn btn-success btn-lg">
                Recipe Master
            </a>

            <a href="/chef/production" class="btn btn-info btn-lg">
                  Kitchen Production
            </a>

            <a href="/chef/wastage" class="btn btn-primary btn-lg">
                  Kitchen Wastage
            </a>

            <!-- Logout -->
            <a href="/logout" class="btn btn-danger btn-lg">
                Logout
            </a>

        </div>

        <hr>

        <div class="text-center">
            <small class="text-muted">
                 2026 StockRoom Kitchen Management
            </small>
        </div>

    </div>

</div>

</body>
</html>
