<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #ff9966, #ff5e62);">

<div class="container mt-5">

    <div class="card shadow-lg p-4" style="border-radius: 15px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Recipe Master</h2>
            <p class="text-muted">Create and manage kitchen recipes</p>
        </div>

        <!-- Create Recipe -->
        <div class="mb-4">
            <h4 class="fw-bold">Create New Recipe</h4>

            <form method="POST" action="/chef/recipes">
                <div class="input-group">
                    <input type="text"
                           name="recipe_name"
                           class="form-control"
                           placeholder="Enter recipe name"
                           required>

                    <button type="submit" class="btn btn-warning">
                        Create Recipe
                    </button>
                </div>
            </form>
        </div>

        <hr>

        <!-- Existing Recipes -->
        <div>
            <h4 class="fw-bold">Existing Recipes</h4>

            {% if recipes %}
                <ul class="list-group mt-3">

                    {% for recipe in recipes %}
                    <li class="list-group-item">

                        <div class="d-flex justify-content-between align-items-center">

                            <!-- Recipe Name -->
                            <div>
                                <strong>{{ recipe.dish_name }}</strong>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex gap-2">

                                <!-- Manage Ingredients -->
                                <a href="/chef/recipe/{{ recipe.id }}"
                                   class="btn btn-primary btn-sm">
                                    Manage
                                </a>

                                <!-- Edit Recipe -->
                                <a href="/chef/recipe/edit/{{ recipe.id }}"
                                   class="btn btn-success btn-sm">
                                    Edit
                                </a>

                                <!-- Delete Recipe -->
                                <a href="/chef/recipe/delete/{{ recipe.id }}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this recipe?')">
                                    Delete
                                </a>

                            </div>

                        </div>

                    </li>
                    {% endfor %}

                </ul>
            {% else %}
                <p class="text-muted mt-3">No recipes created yet.</p>
            {% endif %}
        </div>

        <hr>

        <!-- Navigation -->
        <div class="d-grid gap-2 mt-3">

            <a href="/chef/dashboard" class="btn btn-primary">
                Back to Dashboard
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
